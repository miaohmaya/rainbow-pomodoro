
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rainbow Pomodoro</title>

<style>
:root {
  --blue: #a8d9fa;
  --pale: #eaf1fa;
  --lime: #c9d638;
  --orange: #ff7920;
  --pink: #f8a7b7;
  --black: #000;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 4px;
  font-family: Arial, Helvetica, sans-serif;
}

.widget {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  width: 100%;
  max-width: 650px;
  min-width: 260px;
  aspect-ratio: 1366 / 2022;
  margin: auto;
  background-image: url("./Pomodoro%20Timer%20Mock-up%20(1).png");
  background-size: 100% 100%;
  background-position: center;
  background-repeat: no-repeat;
}

/* Mode buttons */
.modes {
  position: absolute;
  top: 19%;
  left: 7%;
  width: 86%;
  display: flex;
  justify-content: center;
  gap: 3%;
  z-index: 2;
}

button {
  font-family: Arial, Helvetica, sans-serif;
  font-weight: 800;
  text-transform: uppercase;
  color: var(--black);
  cursor: pointer;
  border: 4px solid var(--black);
  border-radius: 17px;
  box-shadow: 0 2px 0 var(--black);
  min-width: 0;
}

.mode {
  flex: 1;
  padding: 12px 2px;
  font-size: clamp(14px, 3.2vw, 22px);
}

.short { background: var(--lime); }
.long { background: var(--orange); }
.break { background: var(--pink); }

.mode[aria-pressed="true"] {
  outline: 3px solid white;
  outline-offset: -7px;
}

/* Slogan in the upper-left corner */
.status {
  position: absolute;
  top: 10%;
  left: 10%;
  width: 65%;
  margin: 0;
  z-index: 2;
  text-align: left;
  font-size: clamp(14px, 2.8vw, 19px);
  line-height: 1.3;
  color: var(--black);
}

/* Enlarged countdown ring */
.clock {
  position: absolute;
  left: 50%;
  top: 54%;
  transform: translate(-50%, -50%);
  width: 58%;
  max-width: 370px;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  z-index: 1;
}

.clock svg {
  display: block;
  width: 100%;
  height: 100%;
}

.track,
.progress,
.progress-outline {
  fill: none;
  stroke-linecap: butt;
  transform: rotate(-90deg);
  transform-origin: 50% 50%;
}

.track {
  stroke: #f0f2c8;
  stroke-width: 8;
}

/* Black outline beneath the colored progress ring */
.progress-outline {
  stroke: var(--black);
  stroke-width: 12;
}

/* Colored countdown ring */
.progress {
  stroke: var(--lime);
  stroke-width: 8;
}

.time {
  position: absolute;
  font-size: clamp(36px, 9.5vw, 76px);
  color: var(--black);
  font-weight: 400;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* Bottom controls */
.controls {
  position: absolute;
  left: 7%;
  bottom: 12%;
  width: 86%;
  display: flex;
  gap: 3%;
  z-index: 2;
}

.control {
  padding: 12px 3px;
  font-size: clamp(12px, 2.8vw, 20px);
}

.start {
  flex: 1.6;
  background: #fde8eb;
}

.reset {
  flex: 1;
  background: #ffd7c4;
}

@media (max-width: 380px) {
  button {
    border-width: 3px;
    border-radius: 12px;
  }
}
</style>
</head>

<body>
<div class="widget">

  <div class="modes">
    <button class="mode short" data-mode="short"
            aria-pressed="false">Short</button>
    <button class="mode long" data-mode="long"
            aria-pressed="false">Long</button>
    <button class="mode break" data-mode="break"
            aria-pressed="false">Break</button>
  </div>

  <div class="status" id="status">One thing at a time.</div>

  <div class="clock">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="track" cx="50" cy="50" r="44"/>

      <circle class="progress-outline" id="progressOutline"
              cx="50" cy="50" r="44"
              stroke-dasharray="276.46"
              stroke-dashoffset="0"/>

      <circle class="progress" id="progress"
              cx="50" cy="50" r="44"
              stroke-dasharray="276.46"
              stroke-dashoffset="0"/>
    </svg>

    <div class="time" id="time">25:00</div>
  </div>

  <div class="controls">
    <button class="control start" id="start">Start / Pause</button>
    <button class="control reset" id="reset">Reset</button>
  </div>

</div>

<script>
const durations = {
  short: 25 * 60,
  long: 50 * 60,
  break: 5 * 60
};

const colors = {
  short: '#c9d638',
  long: '#ff7920',
  break: '#f8a7b7'
};

const circumference = 2 * Math.PI * 44;

const timeEl = document.getElementById('time');
const progress = document.getElementById('progress');
const progressOutline = document.getElementById('progressOutline');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start');
const modeBtns = [...document.querySelectorAll('[data-mode]')];

let mode = 'short';
let remaining = durations.short;
let running = false;
let endAt = null;
let timerId = null;

function render() {
  const minutes = Math.floor(remaining / 60);
  const seconds = remaining % 60;

  timeEl.textContent =
    String(minutes).padStart(2, '0') + ':' +
    String(seconds).padStart(2, '0');

  const offset = circumference * (1 - remaining / durations[mode]);

  progress.style.strokeDasharray = circumference;
  progress.style.strokeDashoffset = offset;
  progress.style.stroke = colors[mode];

  progressOutline.style.strokeDasharray = circumference;
  progressOutline.style.strokeDashoffset = offset;

  document.title = timeEl.textContent + ' — Rainbow Pomodoro';
}

function stop() {
  running = false;
  endAt = null;

  if (timerId) clearInterval(timerId);
  timerId = null;
  startBtn.textContent = 'Start / Pause';
}

function tick() {
  remaining = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
  render();

  if (remaining <= 0) {
    stop();
    statusEl.textContent = 'Session complete! ✦ Take a breath.';
  }
}

function selectMode(nextMode) {
  stop();
  mode = nextMode;
  remaining = durations[mode];

  modeBtns.forEach(button => {
    button.setAttribute(
      'aria-pressed',
      String(button.dataset.mode === mode)
    );
  });

  statusEl.textContent =
    mode === 'break' ? 'A little time to recharge.' :
    mode === 'long' ? 'Settle in for a long focus session.' :
    'One thing at a time.';

  render();
}

startBtn.addEventListener('click', () => {
  if (running) {
    remaining = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
    stop();
    statusEl.textContent = 'Paused. Resume when ready.';
    render();
  } else {
    if (remaining <= 0) remaining = durations[mode];

    running = true;
    endAt = Date.now() + remaining * 1000;
    startBtn.textContent = 'Pause';

    statusEl.textContent =
      mode === 'break' ? 'Enjoy your break.' :
      'You’re in focus mode.';

    if (timerId) clearInterval(timerId);
    timerId = setInterval(tick, 250);
    render();
  }
});

document.getElementById('reset').addEventListener('click', () => {
  stop();
  remaining = durations[mode];
  statusEl.textContent = 'Timer reset.';
  render();
});

modeBtns.forEach(button => {
  button.addEventListener('click', () => selectMode(button.dataset.mode));
});

selectMode('short');
</script>
</body>
</html>
