
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rainbow Pomodoro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rye&display=swap');

:root {
  --blue: #a8d9fa;
  --pale: #eaf1fa;
  --lime: #c9d638;
  --orange: #ff7920;
  --pink: #f8a7b7;
  --black: #000;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 12px;
  background: transparent;
  font-family: Georgia, serif;
}

.widget {
  position: relative;
  overflow: hidden;
  width: 100%;
  max-width: 650px;
  min-width: 280px;
  aspect-ratio: 0.68;
  margin: auto;
  border: 8px solid var(--blue);
  border-radius: 40px;
  background: var(--pale);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16% 5% 12%;
  isolation: isolate;
}

.rainbow {
  position: absolute;
  z-index: -1;
  width: 125%;
  height: 25%;
  pointer-events: none;
  border-radius: 50%;
  border-top: 0;
  border-bottom: 0;
  background: repeating-linear-gradient(
    to bottom,
    var(--orange) 0 13%,
    var(--pale) 13% 17%,
    var(--pink) 17% 30%,
    var(--pale) 30% 34%,
    var(--lime) 34% 47%,
    var(--pale) 47% 51%,
    var(--blue) 51% 64%,
    transparent 64% 100%
  );
}

.rainbow.top {
  top: -3%;
  right: -43%;
  transform: rotate(-28deg);
}

.rainbow.bottom {
  bottom: -7%;
  left: -35%;
  transform: rotate(22deg);
}

.modes {
  display: flex;
  gap: 8px;
  width: 100%;
  justify-content: center;
  z-index: 1;
}

.mode, .control {
  font-family: 'Rye', Georgia, serif;
  font-size: clamp(12px, 3.4vw, 23px);
  text-transform: uppercase;
  border: 4px solid var(--black);
  border-radius: 17px;
  padding: 10px 7px;
  color: var(--black);
  cursor: pointer;
  background: white;
  box-shadow: 0 2px 0 #000;
  flex: 1;
  min-width: 0;
}

.mode.short { background: var(--lime); }
.mode.long { background: var(--orange); }
.mode.break { background: var(--pink); }

.mode[aria-pressed="true"] {
  outline: 3px solid white;
  outline-offset: -7px;
}

.clock {
  position: relative;
  width: min(76%, 390px);
  aspect-ratio: 1;
  margin: auto 0;
  display: grid;
  place-items: center;
}

svg { width: 100%; height: 100%; }

.track, .progress {
  fill: none;
  stroke-width: 9;
}

.track { stroke: #d6e1ec; }
.progress {
  stroke: var(--lime);
  stroke-linecap: butt;
  transform: rotate(-90deg);
  transform-origin: 50% 50%;
  transition: stroke-dashoffset .25s linear;
}

.time {
  position: absolute;
  font-size: clamp(38px, 10vw, 76px);
  color: var(--black);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 3px 3px #a8d9fa;
  white-space: nowrap;
}

.controls {
  display: flex;
  gap: 12px;
  width: 100%;
  justify-content: center;
  z-index: 1;
}

.control { padding: 12px 8px; }
.control.start { background: #fde8eb; flex: 1.6; }
.control.reset { background: #ffd7c4; flex: 1; }

.status {
  margin-top: 12px;
  font-size: 12px;
  text-align: center;
  color: #668db9;
  z-index: 1;
}

@media (max-width: 380px) {
  .widget { border-radius: 28px; border-width: 6px; }
  .mode, .control { border-width: 3px; border-radius: 12px; }
  .modes { gap: 5px; }
  .controls { gap: 7px; }
}
</style>
</head>
<body>
<div class="widget">
  <div class="rainbow top"></div>
  <div class="rainbow bottom"></div>

  <div class="modes">
    <button class="mode short" data-mode="short" aria-pressed="false">Short</button>
    <button class="mode long" data-mode="long" aria-pressed="false">Long</button>
    <button class="mode break" data-mode="break" aria-pressed="false">Break</button>
  </div>

  <div class="clock">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle class="track" cx="50" cy="50" r="44"/>
      <circle class="progress" id="progress" cx="50" cy="50" r="44"
        stroke-dasharray="276.46" stroke-dashoffset="0"/>
    </svg>
    <div class="time" id="time">25:00</div>
  </div>

  <div class="controls">
    <button class="control start" id="start">Start / Pause</button>
    <button class="control reset" id="reset">Reset</button>
  </div>
  <div class="status" id="status">Choose a session and press Start.</div>
</div>

<script>
const durations = {
  short: 25 * 60,
  long: 50 * 60,
  break: 5 * 60
};

const colors = {
  short: '#c9d638',
  long: '#ff7920',
  break: '#f8a7b7'
};

const circumference = 2 * Math.PI * 44;
const timeEl = document.getElementById('time');
const progress = document.getElementById('progress');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start');
const modeBtns = [...document.querySelectorAll('[data-mode]')];

let mode = 'short';
let remaining = durations[mode];
let running = false;
let endAt = null;
let timerId = null;

function render() {
  const mins = Math.floor(remaining / 60);
  const secs = remaining % 60;
  timeEl.textContent =
    String(mins).padStart(2, '0') + ':' +
    String(secs).padStart(2, '0');

  progress.style.strokeDasharray = circumference;
  progress.style.strokeDashoffset =
    circumference * (1 - remaining / durations[mode]);

  progress.style.stroke = colors[mode];
  document.title = timeEl.textContent + ' — Rainbow Pomodoro';
}

function stop() {
  running = false;
  endAt = null;
  if (timerId) clearInterval(timerId);
  timerId = null;
  startBtn.textContent = 'Start';
}

function tick() {
  remaining = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
  render();

  if (remaining <= 0) {
    stop();
    statusEl.textContent = 'Session complete! ✦ Take a breath.';
    startBtn.textContent = 'Start Again';
    try {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification('Rainbow Pomodoro', { body: 'Your session is complete!' });
      }
    } catch (_) {}
  }
}

function selectMode(nextMode) {
  stop();
  mode = nextMode;
  remaining = durations[mode];

  modeBtns.forEach(btn => {
    btn.setAttribute('aria-pressed', String(btn.dataset.mode === mode));
  });

  statusEl.textContent =
    mode === 'break' ? 'A little time to recharge.' :
    mode === 'long' ? 'Settle in for a long focus session.' :
    'One thing at a time. You’ve got this.';

  render();
}

startBtn.addEventListener('click', () => {
  if (running) {
    remaining = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
    stop();
    statusEl.textContent = 'Paused. Resume when you’re ready.';
    render();
  } else {
    if (remaining <= 0) remaining = durations[mode];
    running = true;
    endAt = Date.now() + remaining * 1000;
    startBtn.textContent = 'Pause';
    statusEl.textContent = mode === 'break' ? 'Enjoy your break.' : 'You’re in focus mode.';

    if (timerId) clearInterval(timerId);
    timerId = setInterval(tick, 250);
    render();
  }
});

document.getElementById('reset').addEventListener('click', () => {
  stop();
  remaining = durations[mode];
  statusEl.textContent = 'Timer reset.';
  render();
});

modeBtns.forEach(btn => {
  btn.addEventListener('click', () => selectMode(btn.dataset.mode));
});

render();
selectMode('short');
</script>
</body>
</html>
